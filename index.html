<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OKOLO Studio</title>
<meta name="description" content="OKOLO Studio. Заполни бриф, и я свяжусь с тобой. / Fill in the brief and I’ll get in touch.">
<meta name="theme-color" content="#3B332A">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{--cocoa:#3B332A;--cream:#EAE1CF;--sky:#8FB3F0;--m:24px}
@media(min-width:600px){:root{--m:48px}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cocoa);color:var(--cream)}
body{font:400 16px/1.5 'Nunito Sans',system-ui,sans-serif;hyphens:none}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(24px + env(safe-area-inset-top)) var(--m) calc(32px + env(safe-area-inset-bottom));text-align:center}
.grow{flex:1}
.lang{display:flex;gap:8px}
.chip{font:700 13px/1 'Nunito Sans',sans-serif;border:2px solid var(--cream);color:var(--cream);background:none;border-radius:999px;padding:9px 14px;cursor:pointer;touch-action:manipulation}
.chip[aria-pressed=true]{background:var(--cream);color:var(--cocoa)}
.hero{display:flex;flex-direction:column;align-items:center;gap:24px;max-width:640px;width:100%}
.logo{width:min(300px,80%);height:auto;color:var(--cream);margin-bottom:8px}
@media(min-width:1024px){.logo{width:420px}}
h1{font:900 clamp(28px,7.6vw,48px)/1.12 'Nunito',sans-serif;margin:0;text-wrap:balance}
p{margin:0;max-width:520px;text-wrap:pretty;opacity:.9}
.cta{display:flex;align-items:center;justify-content:center;width:100%;max-width:360px;min-height:52px;padding:14px 28px;border-radius:999px;background:var(--sky);color:var(--cocoa);border:2px solid var(--cocoa);font:900 16px/1 'Nunito',sans-serif;text-decoration:none;white-space:nowrap;touch-action:manipulation;transition:transform .12s}
.cta:active{transform:scale(.98)}
.bottom{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.socials{display:flex;gap:10px}
.social{width:44px;height:44px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;color:var(--cream);opacity:.9}
.social svg{width:20px;height:20px}
.social.soon{opacity:.45}
.mail{color:var(--cream);font-weight:600;font-size:14px;text-underline-offset:4px}
[data-l]{display:none}html[lang=ru] [data-l=ru],html[lang=en] [data-l=en]{display:revert}
</style>
</head>
<body>
<main class="screen">
  <div class="lang" role="group" aria-label="Язык / Language"><button class="chip" data-set="ru">RU</button><button class="chip" data-set="en">EN</button></div>
  <div class="grow"></div>
  <div class="hero">
    <div id="logo"></div>
    <h1><span data-l="ru">Сайт студии<br> скоро будет здесь</span><span data-l="en">The studio site<br> is on its way</span></h1>
    <p><span data-l="ru">А пока можно заполнить бриф, и&nbsp;я свяжусь с&nbsp;тобой, чтобы договориться о&nbsp;созвоне.</span><span data-l="en">Meanwhile, fill in the brief and I’ll get in touch to set up a&nbsp;call.</span></p>
  </div>
  <div class="grow"></div>
  <div class="bottom">
    <a class="cta" href="/brief/"><span data-l="ru">Заполнить бриф</span><span data-l="en">Fill in the brief</span></a>
    <div class="socials"><a class="social" href="https://www.instagram.com/okolo.studio/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a><span class="social soon" role="img" aria-label="Telegram · soon" title="Telegram · soon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z"/><path d="m9 13 8-6"/></svg></span><span class="social soon" role="img" aria-label="Behance · soon" title="Behance · soon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h5a3 3 0 0 1 0 6H3zM3 12h6a3 3 0 0 1 0 6H3z"/><path d="M14 14h7a3.5 3.5 0 1 0-1 2.5M15 7h5"/></svg></span><a class="social" href="mailto:hello@okolo.studio" aria-label="hello@okolo.studio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M4 7.5 12 13l8-5.5"/></svg></a></div>
    <a class="mail" href="mailto:hello@okolo.studio">hello@okolo.studio</a>
  </div>
</main>
<script src="/logo.js"></script>
<script>
document.getElementById('logo').outerHTML = window.OKOLO_LOGO;
var saved; try { saved = localStorage.getItem('okolo-lang'); } catch (e) {}
function setLang(l) { document.documentElement.lang = l; document.querySelectorAll('[data-set]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.set === l); }); try { localStorage.setItem('okolo-lang', l); } catch (e) {} }
setLang(saved || (/^ru/i.test(navigator.language || '') ? 'ru' : 'en'));
document.querySelectorAll('[data-set]').forEach(function (b) { b.onclick = function () { setLang(b.dataset.set); }; });
</script>
</body>
</html>
