<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OKOLO Studio</title>
<meta name="description" content="OKOLO Studio. Заполни бриф, и я свяжусь с тобой. / Fill in the brief and I’ll get in touch.">
<meta name="theme-color" content="#3B332A">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap" rel="stylesheet">
<style>
:root{--cocoa:#3B332A;--cream:#EAE1CF;--sky:#8FB3F0}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--cocoa);color:var(--cream)}
body{font:400 16px/1.5 'Nunito Sans',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:48px 24px calc(32px + env(safe-area-inset-bottom));text-align:center;gap:40px}
.logo{width:min(320px,78vw);height:auto;color:var(--cream)}
p{margin:0;max-width:440px;text-wrap:balance;opacity:.85}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:14px 36px;border-radius:999px;background:var(--sky);color:var(--cocoa);border:2px solid var(--cocoa);font:900 17px/1 'Nunito',sans-serif;text-decoration:none;touch-action:manipulation;transition:transform .12s}
.cta:active{transform:scale(.98)}
.links{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;font-weight:600}
.links a{color:var(--cream);text-underline-offset:4px}
main{display:flex;flex-direction:column;align-items:center;gap:28px}
</style>
</head>
<body>
<main>
<div id="logo"></div><script src="/logo.js"></script><script>document.getElementById("logo").outerHTML = window.OKOLO_LOGO;</script>
<p lang="ru">Сайт студии скоро появится. А пока можно заполнить бриф, и я свяжусь с тобой.</p>
<p lang="en">The studio site is on its way. Meanwhile, fill in the brief and I’ll get in touch.</p>
<a class="cta" href="/brief/" id="cta">Заполнить бриф</a>
</main>
<script>if(!/^ru/i.test(navigator.language||"")){document.documentElement.lang="en";document.querySelector('p[lang=ru]').remove();document.getElementById("cta").textContent="Fill in the brief";}else document.querySelector('p[lang=en]').remove();</script>
<nav class="links"><a href="https://www.instagram.com/okolo.studio/" target="_blank" rel="noopener">Instagram</a><a href="mailto:hello@okolo.studio">hello@okolo.studio</a></nav>
</body>
</html>
